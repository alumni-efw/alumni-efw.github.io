title: Talk Time

items:

  - question: What is Talk Time?
    answer: >
      Talk Time is a friendly online meeting where Alumni members practice English, share experiences, and support each other. It is not a class, a test, or an interview. It is a safe place to practice real conversation and build confidence.
    highlighted: true

  - question: Who can join Talk Time?
    answer: >
      Talk Time is for members of the EFW Alumni Community. 
      If you are an [English for Work](https://www.hopelink.org/programs/english-for-work/) graduate and would like to join Alumni, 
      please start with the [Ways to Connect](/ways-to-connect/) page.
    highlighted: true

  - question: When does Talk Time happen?
    answer: >
      Talk Time usually happens on Wednesday morning and Thursday evening. Please check community channels for the current schedule, Zoom link, and topic of the week.

  - question: Where can I find the Zoom link and weekly topic?
    answer: >
      You can find the Zoom link and weekly topic in Alumni community channels, such as WhatsApp, LinkedIn, or email updates. If the schedule changes, the Leadership Team will try to share an update through the same channels.

  - question: Do I need to prepare before Talk Time?
    answer: >
      No special preparation is required. Each session starts with a short introduction to the topic. The facilitator may share questions, examples, or useful vocabulary to help everyone get ready for the conversation.
    highlighted: true

  - question: Do I need perfect English to join Talk Time?
    answer: >
      No. You do not need perfect English. Talk Time is a place to practice. Mistakes are normal, and participants are encouraged to speak at their own pace.

  - question: Do I have to attend every week?
    answer: >
      No. You can join when you have time. Talk Time is a flexible resource. You can attend regularly, once in a while, or whenever the topic feels useful to you.
    highlighted: true

  - question: Can I just listen during Talk Time?
    answer: >
      Yes. You are welcome to participate at your own pace. You may listen more at first, then speak when you feel ready.

  - question: What happens during a Talk Time session?
    answer: >
      Each session usually starts with a short introduction to the topic. After that, participants move into small Zoom breakout rooms to discuss questions in groups of two or three people. At the end, everyone may return to the main room for a short closing.

  - question: Can I facilitate Talk Time?
    answer: >
      Yes. Alumni members can help facilitate Talk Time. You do not need to be a professional teacher. As a facilitator, you help create a friendly space where members can speak, listen, and practice without pressure.
    highlighted: true

  - question: Can I lead Talk Time only one time?
    answer: >
      Yes. You can lead Talk Time one time or on a regular basis. You can use topics and presentations prepared by the Leadership Team, or you can bring your own topic if there is something you would like to share or discuss.
    highlighted: true

  - question: Why is facilitating Talk Time useful?
    answer: >
      Facilitating Talk Time can help you practice communication, leadership, and group discussion skills in English. It can also be a meaningful volunteer experience for your resume, LinkedIn profile, or future interviews.
