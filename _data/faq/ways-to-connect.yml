# - question: Do you have any question?
#   answer: Yes. I'll send the message.
#   highlighted: true

title: Ways to connect

items:
  - question: Do I need to join every channel?
    answer:  No. You can choose the channel that feels easiest and most useful for you. WhatsApp is helpful for quick reminders and updates. LinkedIn is useful for professional networking. Email updates are good if you prefer a simple summary.
    highlighted: true

  - question: What is the difference between WhatsApp, LinkedIn, and email updates?
    answer: WhatsApp is the fastest way to receive reminders, schedule changes, and short community updates. LinkedIn is a professional space for networking and updates. Email updates are useful if you prefer to receive the most important information in one place.
    highlighted: true

  - question: What is the WhatsApp group for?
    answer: The WhatsApp group is a closed community channel for Alumni members. It is used for important updates, Talk Time reminders, schedule changes, community announcements, useful resources, and relevant questions from members

  - question: Who can join the WhatsApp group?
    answer: The WhatsApp group is for Alumni members. To keep the group useful and respectful, members are expected to follow the Community Guidelines.
    highlighted: true

  - question: Can I ask questions in WhatsApp?
    answer: Yes, if your question is relevant to Alumni Community, English practice, events, resources, job search, or community support. Please keep messages respectful, clear, and useful for the group.
