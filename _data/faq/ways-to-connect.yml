# - Put ONE space after each colon [:]
# - Keep the same indentation (spaces)
# - Do not remove the dash [-]
#   The dash means "start of a new FAQ item"

# Format:
# - question: Your question here
#   answer: Your answer here
#   highlighted: true   # optional

# About /highlighted/:
# - highlighted: true
#   → This FAQ item will also appear on FAQ section in the individual page
#
# - If highlighted is omitted, it is treated as false by default
#   → The item will appear only in the Full FAQ page
#
# - Add highlighted: true for FAQ items that should appear
