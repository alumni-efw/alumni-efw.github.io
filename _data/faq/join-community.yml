title: Joining Alumni Community

items:
  
  - question: How do I join the Alumni Community?
    answer: >
      You can start by visiting the Ways to Connect page and choosing the channel that works best for you. Depending on the current process, you may be asked to fill out a short form before joining community channels such as WhatsApp or LinkedIn.

  - question: Who can join the Alumni Community?
    answer: >
      Alumni Community is mainly for English for Work graduates. If you are not sure whether you can join, you can contact us and we will help you understand the current process.

  - question: Do I need to fill out a registration form?
    answer: >
      Usually, yes. A registration or access form helps the Leadership Team understand who is joining and how to contact you. We try to collect only the information that is useful for community communication, planning, and support.

  - question: What happens after I submit the form?
    answer: >
      After you submit the form, a Leadership Team member may review your information and send you the next steps. This may include links to community channels, information about Talk Time, or other helpful Alumni resources.

  - question: Can I join if I am busy right now?
    answer: >
      Yes. You do not need to be ready for regular participation. You can join now, receive updates, and participate later when you have more time or energy.

  - question: Can I leave the Alumni Community later?
    answer: >
      Yes. You can leave community channels or unsubscribe from email updates. If you want your information updated or removed from Alumni records, you can contact us.

