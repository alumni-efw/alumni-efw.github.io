title: Community Guidelines

items:

  - question: Why do we have Community Guidelines?
    answer: >
    Community Guidelines help keep Alumni Community respectful, safe, supportive, and useful for members. They help everyone understand what kind of communication is expected in community channels and activities.

  - question: What kind of communication is expected?
    answer: >
    We ask members to communicate with respect, kindness, and patience. Alumni Community includes people from different countries, cultures, languages, professions, and life experiences.

  - question: What should I not post in community channels?
    answer: >
    Please do not post spam, unrelated promotions, offensive messages, political arguments, private information about others, or content that may make members feel unsafe or uncomfortable.

  - question: Can I share someone’s photo, story, or contact information?
    answer: >
    No, not without permission. Please do not share another person’s photo, personal story, phone number, email address, job search details, or private information unless that person clearly agrees.

  - question: Can I promote my business, service, or event?
    answer: >
    Please ask a Leadership Team member first. Some resources may be useful for Alumni, but community channels should not become a place for unrelated advertising or repeated promotion.

  - question: What happens if someone does not follow the guidelines?
    answer: >
    The Leadership Team may contact the person, remove a message, limit participation, or take another appropriate step depending on the situation. The goal is to keep the community safe, respectful, and useful.

  - question: Where can I read the full Community Guidelines?
    answer: >
    You can read the full Community Guidelines on the Community Guidelines page.
