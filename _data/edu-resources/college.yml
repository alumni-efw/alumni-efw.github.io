title: College Classes & Programs

intro: >
  [Community and Technical Colleges in Washington State](https://www.sbctc.edu/our-colleges/explore-colleges/default.aspx) offer several classes and programs for people who want to improve their skills, prepare for college-level coursework, and prepare for employment.

program_description:
  - |
    **English language classes ($25/quarter)** :
    for English language learners who want to develop their English speaking, listening, reading, and writing skills.

    Classes range from beginning to advanced level.

    a.k.a: ELL (English Language Learner/Learning), ESL (English as an Second Language)

  - |
    **ABE classes ($25/quarter)** : for people who want to develop their reading, writing, and math skills to earn a GED or high school diploma,
    get a job or advance in a job, or prepare for college.

  - |
    **I-BEST (full college tuition)** : stands for Integrated Basic Education and Skills Training.
    Students improve their reading, writing, math, and communication skills while training for a specific job.
    Students can train to become an accountant, mechanic, machinist, office assistant, preschool teacher, nursing assistant, and more!

    Search a database of [I-BEST programs](https://ibestprograms.sbctc.edu/)

