title: Pre-Apprenticeship and Apprenticeship Programs

intro: >
  Pre-apprenticeship programs help people build the skills and confidence needed to enter an apprenticeship.
  Apprenticeships combine paid on-the-job training with classroom instruction, allowing participants to gain practical experience, learn industry knowledge, earn a living wage, and, in some programs, receive college credit.
  Browse [apprenticeship opportunities across Washington State](https://secure.lni.wa.gov/arts-public/#/)

