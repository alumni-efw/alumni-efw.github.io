title: Privacy & Data Notice
updated: May 2026
intro: EFW Alumni Community is a volunteer-led community for English for Work alumni. This notice explains what information we may collect through our website, forms, and community activities, and how we use it.

sections:
  - id: 1
    title: What information we collect
    content:
      - The EFW Alumni Community website itself does not collect personal information directly.
      - "However, we may use external forms, such as Fillout Forms, for activities such as:"
    bullets:
      - Alumni registration;
      - requesting access to community channels;
      - applying for volunteer opportunities;
      - signing up to help with events or activities;
      - submitting ideas, questions, or feedback.
    content2:
      - "Depending on the form, we may ask for information such as:"
    bullets2:
      - your name;
      - email address;
      - phone number, if needed for community communication;
      - which English for Work course or quarter you attended;
      - your teacher's name, if needed to help confirm Alumni eligibility;
      - your professional interests or career field;
      - your interest in volunteering or joining activities;
      - any message or information you choose to share with us.
    content3:
      - Please do not submit sensitive personal information unless it is clearly requested and necessary.

  - id: 2
    title: How we use your information
    content:
      - "We use the information you provide only for EFW Alumni Community purposes, such as:"
    bullets:
      - confirming that you are an English for Work alum;
      - helping you join Alumni communication channels;
      - contacting you about Alumni activities, events, or volunteer opportunities;
      - reviewing volunteer applications or interest forms;
      - improving Alumni activities and communication;
      - understanding what resources may be useful for Alumni members.
    content2:
      - We do not sell your personal information.

  - id: 3
    title: Fillout Forms
    content:
      - Some forms on this website may be hosted by Fillout Forms.
      - When you open a Fillout Form, you are leaving the EFW Alumni Community website and using a Fillout service. Information submitted through Fillout Forms may be stored and processed according to Fillout’s own privacy and security practices.
      - Before submitting a form, please review the information requested and submit only what you are comfortable sharing.

  - id: 4
    title: Who can access the information
    content:
      - Access to form responses is limited to EFW Alumni Community team members who need the information for their role.
      - "For example, this may include people helping with:"
    bullets:
      - Alumni registration;
      - membership coordination;
      - communication;
      - volunteer coordination;
      - event planning;
      - website or administrative support.
    content2:
      - We try to limit access to only what is needed. When a volunteer no longer needs access for their role, access should be removed.

  - id: 5
    title: Community channels and external platforms
    content:
      - EFW Alumni Community may use external platforms such as WhatsApp, LinkedIn, Zoom, email, or Fillout Forms.
      - Each platform has its own privacy practices and settings. For example, if you join a WhatsApp group, other members may be able to see your name, phone number, profile photo, or messages depending on your WhatsApp settings.
      - Please be careful when sharing personal information in community channels.

  - id: 6
    title: Website analytics
    content:
      - At this time, we do not use Google Analytics or other external website analytics tools on this website.
      - This means we are not currently using third-party analytics tools to track how visitors use the website.
      - If we decide to add website analytics in the future, we will update this notice.

  - id: 7
    title: Photos, stories, and testimonials
    content:
      - We will not intentionally publish your photo, personal story, testimonial, or identifying personal information on the public website without your permission.
      - If we ask to share your story or feedback publicly, we will explain how it may be used and ask for your consent first.

  - id: 8
    title:  How long we keep information
    content:
      - We keep information only as long as it is useful for Alumni Community purposes, such as managing membership, communication, activities, volunteer opportunities, or internal planning.
      - Because the EFW Alumni Community is volunteer-led, our data retention process may continue to develop over time. We will try to review and remove information that is no longer needed.

  - id: 9
    title: Your choices
    content:
      - You can choose not to submit a form.
      - "You can also contact us if you want to:"
    bullets:
      - ask what information you submitted;
      - update your information;
      - ask us to remove your information from Alumni records, when possible;
      - stop receiving Alumni communications.
    content2:
      - Some information may need to be kept for a limited time if it is needed for community administration, safety, or recordkeeping.

  - id: 10
    title: Contact us
    content:
      - "If you have questions about this Privacy & Data Notice or how your information is used,  please use our contact form:"
      - "[Contact Alumni Team](https://registrationforms.fillout.com/t/s7iyKAEST4us)"

  - id: 11
    title: Updates to this notice
    content: We may update this Privacy & Data Notice as the EFW Alumni Community website, forms, activities, or tools change.
